# Configuration for the Rodin Frame Engine Prototype

# Gemini model to be used by the LLM client.
# Examples: "gemini-2.5-flash-lite", "gemini-2.5-flash", "gemini-2.5-pro"
model_name: "gemini-2.5-flash-lite"

# Logging level for the application console.
# Determines the verbosity of the output.
# Options: "DEBUG", "INFO", "WARNING", "ERROR"
log_level: "DEBUG"

# Configuration for the Marty Frame's session structure.
# Defines the time boundaries in MINUTES for each phase of the conversation.
# Phase 1: Identify knowledge gaps and what needs to be remembered
# Phase 2: Create the mnemonic collaboratively
# Phase 3: Practice and memorization
phases:
  phase_1_end_minutes: 2
  phase_2_end_minutes: 8
  phase_3_end_minutes: 10
